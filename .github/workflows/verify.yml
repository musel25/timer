name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug
        working-directory: android-widget
      - uses: actions/upload-artifact@v4
        with:
          name: planner-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm run install:all
      - run: npm run verify
      - name: Build production image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t timer:ci .
      - name: Check the running image
        run: ./scripts/image-smoke.sh timer:ci "$GITHUB_SHA"
